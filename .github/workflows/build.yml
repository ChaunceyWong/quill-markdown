name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    # macos-14 runs on Apple Silicon, matching the aarch64 target.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundle
        # Bundle only the .app here: Tauri's DMG script needs Finder
        # automation, which is unavailable in a headless CI runner.
        run: pnpm tauri build --bundles app

      - name: Create DMG with hdiutil
        run: |
          mkdir -p src-tauri/target/release/bundle/dmg
          hdiutil create \
            -volname "Quill Markdown" \
            -srcfolder "src-tauri/target/release/bundle/macos/Quill Markdown.app" \
            -ov -format UDZO \
            "src-tauri/target/release/bundle/dmg/Quill Markdown_0.1.0_aarch64.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Quill-Markdown-aarch64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
