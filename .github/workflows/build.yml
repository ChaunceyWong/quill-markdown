name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']        # e.g. v0.1.0 -> publish a GitHub Release
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    permissions:
      contents: write   # required to create/update GitHub Releases
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Install deps first so tauri-action can reuse them.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action handles the whole build: on macOS it automatically
      # imports APPLE_CERTIFICATE into a temporary keychain, signs the app
      # with APPLE_SIGNING_IDENTITY, notarizes with APPLE_ID/APPLE_PASSWORD/
      # APPLE_TEAM_ID and staples the ticket. If those secrets are absent,
      # it simply produces an unsigned bundle (no manual xattr step needed
      # only when they are present).
      - name: Build, sign and notarize (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS code signing / notarization (optional) ---
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          tauriScript: pnpm tauri
          args: --target aarch64-apple-darwin
          # Only publish to a Release on version tags.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'Quill Markdown v__VERSION__'
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterSignatures: false

      # tauri-action uploads the DMG to the release by itself; keep an
      # Actions artifact too so unsigned builds are downloadable from the
      # workflow run page even without a Release.
      - name: Upload DMG as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quill-Markdown-aarch64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
