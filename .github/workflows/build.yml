name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']        # e.g. v0.1.0 -> create a GitHub Release
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    permissions:
      contents: write   # required to create/update GitHub Releases
    # macos-latest is available on GitHub-hosted runners. We explicitly
    # cross-compile to aarch64 so the artifact is always Apple Silicon,
    # regardless of the runner's own architecture.
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app bundle (aarch64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        # Bundle only the .app here: Tauri's DMG script needs Finder
        # automation, which is unavailable in a headless CI runner.
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app

      # ---- Optional code signing + notarization -------------------------
      # Fully bypassing Gatekeeper from inside the app is impossible: macOS
      # security cannot be disabled by app config. The only legitimate way
      # for users to open the app without manual xattr commands is to sign
      # and notarize with an Apple Developer ID certificate. Configure the
      # secrets below in Settings -> Secrets and variables -> Actions; until
      # then these steps are skipped and the DMG is unsigned.
      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" -A \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$MACOS_CERT_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign app bundle
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --deep --sign "$MACOS_SIGN_IDENTITY" \
            --options runtime --timestamp \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Quill Markdown.app"

      - name: Create DMG with hdiutil
        run: |
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          mkdir -p "$BUNDLE_DIR/dmg"
          hdiutil create \
            -volname "Quill Markdown" \
            -srcfolder "$BUNDLE_DIR/macos/Quill Markdown.app" \
            -ov -format UDZO \
            "$BUNDLE_DIR/dmg/Quill Markdown_${{ steps.version.outputs.value }}_aarch64.dmg"

      - name: Notarize DMG
        if: env.MACOS_CERT_P12 != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Quill Markdown_${{ steps.version.outputs.value }}_aarch64.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quill-Markdown-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # On a v* tag, publish the DMG to the GitHub Release. The release is
      # created automatically if it doesn't exist yet.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
